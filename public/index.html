<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Digestlit</title>
  <meta name="description" content="Digestlit reads the new papers in your field for you and sends a report on what is new." />
  <meta name="theme-color" content="#f8f5ee" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-in">
      <a href="/" class="brand" data-link aria-label="Digestlit home">
        <span id="brand-logo"></span>
        <span class="brand-name">Digestlit</span>
      </a>
      <nav class="topnav" id="topnav" aria-label="Sections" hidden>
        <a href="/trackers" data-link data-nav="trackers">Trackers</a>
        <a href="/reports" data-link data-nav="reports">Reports</a>
        <a href="/monthly" data-link data-nav="monthly">Monthly</a>
        <a href="/get-a-key" data-link data-nav="get-a-key">Get a key</a>
        <a href="/settings" data-link data-nav="settings">Settings</a>
      </nav>
      <a href="/signin" class="btn btn-quiet" id="signin-link" data-link hidden>Sign in</a>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-in">
      <p>Digestlit reads new papers from free scholarly indexes. Reports say whether each paper was read in full or from its abstract.</p>
      <p class="fine"><a href="/logo" data-link>Logo versions</a> · © <span id="year"></span> Digestlit</p>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
